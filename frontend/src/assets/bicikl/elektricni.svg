<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <g opacity="0.12"><circle cx="70" cy="240" r="90" fill="#ffffff"/><circle cx="360" cy="40" r="70" fill="#ffffff"/></g>
  <rect x="70" y="65" width="260" height="170" rx="24" fill="#ffffff" opacity="0.15"/>

  <!-- MTB/E-bike ram -->
  <g stroke="#f8fafc" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="130" cy="185" r="45"/>
    <circle cx="270" cy="185" r="45"/>
    <path d="M 130,185 L 180,185 L 225,130 L 260,130 L 270,185"/>
  </g>
  <!-- Baterija na ramu -->
  <rect x="185" y="135" width="30" height="40" rx="5" fill="#f59e0b"/>
  <!-- Motor u točku -->
  <circle cx="130" cy="185" r="15" fill="#1e1b4b" stroke="#f8fafc" stroke-width="3"/>
  <path d="M 190,125 L 205,115" stroke="#f8fafc" stroke-width="6"/> <!-- Korman -->
</svg>

