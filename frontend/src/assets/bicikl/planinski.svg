<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <g opacity="0.12"><circle cx="70" cy="240" r="90" fill="#ffffff"/><circle cx="360" cy="40" r="70" fill="#ffffff"/></g>
  <rect x="70" y="65" width="260" height="170" rx="24" fill="#ffffff" opacity="0.15"/>

  <!-- Drumski ram -->
  <g stroke="#f8fafc" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="120" cy="180" r="40"/> <!-- Zadnji točak -->
    <circle cx="280" cy="180" r="40"/> <!-- Prednji točak -->
    <path d="M 120,180 L 170,180 L 220,120 L 270,120 L 280,180"/> <!-- Ram -->
    <path d="M 170,180 L 190,110"/> <!-- Cev sedišta -->
    <path d="M 220,120 L 230,100 L 245,105"/> <!-- Korman "drop bar" -->
  </g>
  <circle cx="170" cy="180" r="10" fill="#1e1b4b"/> <!-- Lančanik -->
  <path d="M 185,100 Q 200,95 215,100" fill="#f59e0b"/> <!-- Sedište -->
</svg>

